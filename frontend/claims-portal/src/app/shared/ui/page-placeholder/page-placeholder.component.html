<section class="page">

  <div class="page-heading">
    <p class="section-label">{{ page.section }}</p>

    <h1>{{ page.title }}</h1>

    <p class="description">
      {{ page.description }}
    </p>
  </div>

  <div class="placeholder-card">

    <div class="placeholder-icon">✦</div>

    <h2>Page structure ready</h2>

    <p class="placeholder-description">
      The interface for this feature will be implemented in the next development steps.
    </p>

    <div class="feature-list">
      @for (feature of page.features; track feature) {
      <div class="feature-item">
        <span class="feature-check">✓</span>
        <span>{{ feature }}</span>
      </div>
      }
    </div>

  </div>

</section>
